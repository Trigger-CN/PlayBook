    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;transition:background-color .25s,color .25s}button,input,textarea,select{font:inherit}button{color:inherit}a{color:inherit;text-decoration:none}

    .shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}

    .brand{display:inline-flex;align-items:center;gap:10px;margin:0 6px 22px;font-family:Georgia,"Noto Serif SC",serif;font-size:19px;font-weight:700}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--coral);box-shadow:0 5px 0 var(--coral-base);transform:rotate(-7deg)}.mark i{display:block;width:12px;height:12px;border:3px solid var(--ink);border-radius:50%}
    .nav-item{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;padding:0 0 6px;border:0;border-radius:13px;cursor:pointer;background:var(--line);text-align:left}
    .nav-item>span{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:inherit;background:var(--soft);transform:translateY(-6px);transition:transform .1s,filter .12s;font-size:13.5px;font-weight:750;color:var(--muted)}

    .main{padding:0 30px 56px;min-width:0}
    .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(4px)}

    .top-actions{display:flex;align-items:center;gap:14px}
    .menu-btn{display:none;position:relative;width:46px;height:46px;padding:0 0 5px;border:0;border-radius:12px;cursor:pointer;background:var(--coral-base)}.menu-btn span{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;background:var(--coral);transform:translateY(-5px);font-size:17px;font-weight:900;color:#fff;transition:transform .1s}.menu-btn:active span{transform:translateY(-1px)}
    .toggle{position:relative;width:74px;height:39px;padding:0;border:0;border-radius:99px;cursor:pointer;background:transparent}.toggle:before{content:"";position:absolute;inset:6px 0 0;border-radius:inherit;background:var(--pink-base)}.toggle-top{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:inherit;color:#28152b;background:var(--pink);transition:transform .12s}.knob{width:27px;height:27px;border-radius:50%;background:var(--cream);box-shadow:inset -3px -3px 0 rgba(100,61,0,.12);transition:transform .2s}[data-theme=night] .knob{transform:translateX(27px)}.toggle:active .toggle-top{transform:translateY(5px)}
    .view-btn{position:relative;min-height:42px;padding:0 0 7px;border:0;border-radius:13px;cursor:pointer;background:var(--sky-base)}.view-btn span{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 15px;border-radius:inherit;background:var(--sky);transform:translateY(-7px);font-size:12.5px;font-weight:850;color:#15344e;transition:transform .1s}.view-btn:hover span{transform:translateY(-9px)}.view-btn:active span{transform:translateY(-1px)}
    .avatar-btn{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;background:var(--mint);box-shadow:0 5px 0 var(--mint-base);font-size:13px;font-weight:900;color:#0d3826;transform:translateY(-5px);transition:transform .1s}.avatar-btn:hover{transform:translateY(-7px)}.avatar-btn:active{transform:translateY(0)}

    .pill.draft{background:rgba(74,45,17,.18);color:#4a2d11}
    .pill.archived{background:rgba(33,21,34,.12);color:rgba(33,21,34,.6)}
    .pill.type{background:rgba(33,21,34,.1);color:rgba(33,21,34,.75)}
    .item .cnt{color:rgba(33,21,34,.6);font-size:11px;font-weight:800}
    /* 抽屉编辑 */
    .drawer-backdrop{position:fixed;inset:0;z-index:30;display:none;background:rgba(33,21,34,.4)}
    .drawer-backdrop.show{display:block}
    .drawer{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(430px,94vw);padding:24px 22px;overflow-y:auto;background:var(--canvas);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .2s}
    .drawer.open{transform:none}
    .drawer h2{margin:0 0 4px;font-family:Georgia,"Noto Serif SC",serif;font-size:21px}
    .drawer .sub{color:var(--muted);font-size:12px;font-weight:700;margin:0 0 18px}
    .field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:750}.field .hint{color:var(--muted);font-size:11px;font-weight:700;margin-top:5px}
    .field input,.field textarea,.field select{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;color:var(--ink);background:var(--soft)}.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sky)}
    .field textarea{min-height:96px;resize:vertical}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .type-opt{position:relative;padding:0 0 5px;border:0;border-radius:11px;cursor:pointer;background:var(--line)}
    .type-opt span{display:block;padding:9px 4px;border-radius:inherit;background:var(--soft);transform:translateY(-5px);font-size:12px;font-weight:800;color:var(--muted);text-align:center;transition:transform .1s}
    .type-opt:hover span{transform:translateY(-6px)}
    .type-opt[aria-pressed=true] span{background:var(--pink);color:#341624}
    .drawer-actions{position:sticky;bottom:0;display:flex;gap:12px;padding:14px 0;background:linear-gradient(transparent,var(--canvas) 30%)}
    .drawer-actions .button{flex:1}
    .preview{margin-top:6px;padding:13px;border:1px dashed var(--line);border-radius:13px;background:var(--soft)}
    .preview small{display:block;color:var(--muted);font-size:10.5px;font-weight:800;margin-bottom:6px}
    .preview b{font-size:13.5px}
    @media(max-width:960px){.shell{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;z-index:20;width:250px;transform:translateX(-105%);transition:transform .2s;background:var(--canvas)}.side.open{transform:none}.menu-btn{display:inline-block}.item{grid-template-columns:108px 1fr}.item .when{display:none}.item .face{grid-template-columns:108px 1fr}}
    @media(max-width:600px){.main{padding:0 18px 40px}.topbar{flex-wrap:wrap}.topbar h1{font-size:20px}.item{grid-template-columns:1fr}.item .face{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>

          <label for="d-media">媒体（单图）</label>
          <input id="d-media" type="file" accept="image/*">
        </div>
        <div class="field">
          <label for="d-url">外部链接</label>
          <input id="d-url" type="url" placeholder="https://…">
        </div>
      </div>
      <div class="field">
        <label>实时预览</label>
        <div class="preview"><small>时间轴卡片预览</small><b id="preview-title">（未命名节点）</b><p id="preview-content" style="margin:4px 0 0;color:var(--muted);font-size:12.5px">在上方输入内容后这里会实时更新…</p></div>
      </div>
      <div class="drawer-actions">
        <button class="button small cream" type="button" id="cancel-btn"><span>取消</span></button>
        <button class="button small mint" type="button" id="save-btn"><span>保存草稿</span></button>
        <button class="button small" type="button" id="publish-btn"><span>发布 →</span></button>
      </div>
    </form>
  </div>

  <script>
    const root=document.documentElement;
    const toggle=document.getElementById('theme-toggle');
    const saved=localStorage.getItem('playbook-theme');
    const initial=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'light');
    function setTheme(theme){root.dataset.theme=theme;if(toggle){toggle.setAttribute('aria-pressed',String(theme==='night'));toggle.setAttribute('aria-label',theme==='night'?'切换日间主题':'切换晚间主题')}localStorage.setItem('playbook-theme',theme)}
    setTheme(initial);
    if(toggle)toggle.addEventListener('click',()=>setTheme(root.dataset.theme==='night'?'light':'night'));
    const menuBtn=document.getElementById('menu-btn');
    const side=document.getElementById('side-nav');
    menuBtn.addEventListener('click',()=>{const open=side.classList.toggle('open');menuBtn.setAttribute('aria-expanded',String(open))});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){side.classList.remove('open');closeDrawer()}});
    // 抽屉
    const drawer=document.getElementById('drawer');
    const backdrop=document.getElementById('backdrop');
    const dTitle=document.getElementById('d-title');
    const dContent=document.getElementById('d-content');
    const dDate=document.getElementById('d-date');
    function openDrawer(item){
      if(item){
        document.getElementById('drawer-title').textContent='编辑节点';
        dTitle.value=item.dataset.title||'';
        dContent.value=item.dataset.content||'';
        dDate.value=(item.dataset.date||'2026-07-17')+'T10:30';
      }else{
        document.getElementById('drawer-title').textContent='新建节点';
        dTitle.value='';dContent.value='';dDate.value='';
      }
      updatePreview();
      drawer.classList.add('open');backdrop.classList.add('show');
      dDate.focus();
    }
    function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('show')}
    document.querySelectorAll('.item').forEach(item=>item.addEventListener('click',()=>openDrawer(item)));
    document.getElementById('new-btn').addEventListener('click',()=>openDrawer(null));
    document.getElementById('cancel-btn').addEventListener('click',closeDrawer);
    backdrop.addEventListener('click',closeDrawer);
    function updatePreview(){
      document.getElementById('preview-title').textContent=dTitle.value||'（未命名节点）';
      document.getElementById('preview-content').textContent=dContent.value||'在上方输入内容后这里会实时更新…';
    }
    dTitle.addEventListener('input',updatePreview);
    dContent.addEventListener('input',updatePreview);
    // 类型单选
    document.querySelectorAll('.type-opt').forEach(opt=>opt.addEventListener('click',()=>{
      document.querySelectorAll('.type-opt').forEach(o=>o.setAttribute('aria-pressed','false'));
      opt.setAttribute('aria-pressed','true');
    }));
    // 保存/发布反馈
    ['save-btn','publish-btn'].forEach(id=>{
      document.getElementById(id).addEventListener('click',e=>{
        const b=e.currentTarget;const span=b.querySelector('span');const orig=span.textContent;
        b.disabled=true;span.textContent='保存中…';
        setTimeout(()=>{b.disabled=false;span.textContent=orig;closeDrawer()},700);
      });
    });
    // 筛选（演示）
    const q=document.getElementById('tl-q');
    function filterItems(){
      const kw=(q.value||'').trim().toLowerCase();
      document.querySelectorAll('.item').forEach(it=>{
        it.style.display=!kw||it.textContent.toLowerCase().includes(kw)?'':'none';
      });
    }
    q.addEventListener('input',filterItems);
  </script>
</body>
</html>
