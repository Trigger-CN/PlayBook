<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Playbook 个人内容站 - 后台登录与框架设计 Demo（noindex）">
  <meta name="robots" content="noindex,nofollow">
  <title>登录 - Playbook 后台</title>
  <style>
    :root{--canvas:#fffdf8;--ink:#211522;--muted:#765f73;--line:rgba(72,42,62,.12);--surface:#fff;--soft:#fff0e6;--coral:#ff656c;--coral-base:#72002f;--pink:#f58bc5;--pink-base:#9b078b;--cream:#ffe5c5;--cream-base:#b78122;--mint:#82e2bf;--mint-base:#146044;--sky:#8dd1ff;--sky-base:#1c6199;--lilac:#e989ee;--lilac-base:#90009d;--shell:#ffc9cb;--grid:rgba(72,42,62,.08);--shadow:0 9px 0 rgba(114,0,47,.13)}
    [data-theme=night]{--canvas:#21162c;--ink:#fff9f1;--muted:#cdbbd0;--line:rgba(255,230,204,.14);--surface:#31223d;--soft:#3e2b4a;--coral:#ff7379;--coral-base:#5a082e;--pink:#e995d8;--pink-base:#70106e;--cream:#ffdfaa;--cream-base:#76511d;--mint:#7fe0bd;--mint-base:#104934;--sky:#82c7f2;--sky-base:#153e6e;--lilac:#d49aff;--lilac-base:#4b246e;--shell:#4a304f;--grid:rgba(255,230,204,.08);--shadow:0 9px 0 rgba(15,6,21,.3)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;transition:background-color .25s,color .25s;padding:32px 18px}button,input{font:inherit}button{color:inherit}a{color:inherit;text-decoration:none}
    :focus-visible{outline:4px solid var(--sky);outline-offset:4px}
    .login{width:min(420px,100%)}
    .brand-row{display:flex;justify-content:center;margin-bottom:26px}
    .brand{display:inline-flex;align-items:center;gap:11px;font-family:Georgia,"Noto Serif SC",serif;font-size:22px;font-weight:700}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:var(--coral);box-shadow:0 6px 0 var(--coral-base);transform:rotate(-7deg)}.mark i{display:block;width:14px;height:14px;border:3px solid var(--ink);border-radius:50%}
    .card{padding:30px 28px;border:1px solid var(--line);border-radius:26px;background:var(--surface);box-shadow:var(--shadow)}
    .card h1{margin:0 0 6px;font-family:Georgia,"Noto Serif SC",serif;font-size:26px;text-align:center}
    .card .sub{margin:0 0 24px;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
    .toggle{position:relative;width:74px;height:39px;margin:0 auto 24px;display:block;padding:0;border:0;border-radius:99px;cursor:pointer;background:transparent}.toggle:before{content:"";position:absolute;inset:6px 0 0;border-radius:inherit;background:var(--pink-base)}.toggle-top{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:inherit;color:#28152b;background:var(--pink);transition:transform .12s}.knob{width:27px;height:27px;border-radius:50%;background:var(--cream);box-shadow:inset -3px -3px 0 rgba(100,61,0,.12);transition:transform .2s}[data-theme=night] .knob{transform:translateX(27px)}.toggle:active .toggle-top{transform:translateY(5px)}
    .field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:12.5px;font-weight:750}.field input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;color:var(--ink);background:var(--soft)}.field input:focus{outline:none;border-color:var(--sky)}
    .button{--cap:var(--coral);--base:var(--coral-base);position:relative;display:inline-grid;width:100%;min-height:52px;place-items:center;padding:0 0 8px;border:0;border-radius:16px;cursor:pointer;background:var(--base);font-weight:850}.button>span{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;padding:0 21px;border-radius:inherit;background:var(--cap);transform:translateY(-8px);transition:transform .11s,filter .15s}.button:hover>span{transform:translateY(-11px);filter:brightness(1.035) saturate(1.05)}.button:active>span{transform:translateY(-2px)}.button:disabled{cursor:not-allowed;opacity:.48}.button:disabled>span{transform:translateY(-4px)}.button.sky{--cap:var(--sky);--base:var(--sky-base);color:#15344e}
    .msg{display:none;margin-top:16px;padding:12px 14px;border-radius:13px;background:color-mix(in srgb,var(--coral) 18%,var(--surface));font-size:13px;font-weight:700}.msg.show{display:block}
    .secure{display:flex;gap:8px;justify-content:center;margin-top:18px;color:var(--muted);font-size:11px;font-weight:700;text-align:center;line-height:1.6}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:11px;font-weight:800}.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
    .back{display:block;margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px;font-weight:700}.back:hover{color:var(--ink)}
    .shell-note{max-width:420px;margin:26px auto 0;padding:14px 18px;border:1px dashed var(--line);border-radius:14px;background:var(--soft);color:var(--muted);font-size:12px;line-height:1.7;text-align:center}
    .shell-note a{color:var(--ink);font-weight:800}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand-row"><a class="brand" href="01-home.html"><span class="mark"><i></i></span>Playbook 后台</a></div>
    <div class="card">
      <h1>管理员登录</h1>
      <p class="sub">仅限站长使用 · 登录行为将记录审计日志</p>
      <button class="toggle" id="theme-toggle" type="button" aria-label="切换晚间主题" aria-pressed="false"><span class="toggle-top">☼<span class="knob"></span>☾</span></button>
      <form onsubmit="return false">
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="admin@playbook.example" autocomplete="username" required>
        </div>
        <button class="button" type="button" id="login-btn"><span id="login-label">发送魔法链接 →</span></button>
        <p class="msg" id="login-msg" role="alert">✓ 登录链接已发送到邮箱，10 分钟内有效。</p>
        <div class="divider">或</div>
        <button class="button sky" type="button"><span>使用 GitHub 继续</span></button>
      </form>
      <p class="secure">🔒 会话由 Supabase Auth 管理 · 未授权访问将被拒绝并记录</p>
    </div>
    <p class="shell-note">登录后的后台框架演示：<a href="09-admin-dashboard.html">仪表盘 →</a>（左侧导航 + 顶部栏结构）</p>
    <a class="back" href="index.html">← 返回 Demo 索引</a>
  </main>
  <script>
    const root=document.documentElement;
    const toggle=document.getElementById('theme-toggle');
    const saved=localStorage.getItem('playbook-theme');
    const initial=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'light');
    function setTheme(theme){root.dataset.theme=theme;if(toggle){toggle.setAttribute('aria-pressed',String(theme==='night'));toggle.setAttribute('aria-label',theme==='night'?'切换日间主题':'切换晚间主题')}localStorage.setItem('playbook-theme',theme)}
    setTheme(initial);
    if(toggle)toggle.addEventListener('click',()=>setTheme(root.dataset.theme==='night'?'light':'night'));
    const btn=document.getElementById('login-btn');
    const label=document.getElementById('login-label');
    const msg=document.getElementById('login-msg');
    btn.addEventListener('click',()=>{
      btn.disabled=true;label.textContent='发送中…';
      setTimeout(()=>{
        btn.disabled=false;label.textContent='发送魔法链接 →';
        msg.classList.add('show');
        setTimeout(()=>msg.classList.remove('show'),4000);
      },900);
    });
  </script>
</body>
</html>
